<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>АСК-Фасад · Термопанели</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--bg:#f4eee2;--card:#fffcf6;--ink:#282019;--muted:#93876f;--line:#e6dcc8;--accent:#b0522c;--accent-dark:#8e3f20;--accent-soft:#f6e5d7;--dark:#241b13;--ok:#4e7d5b;--warn:#b3842d;--wa:#2fae4d}
html,body{height:100%}
body{background:#171210;font-family:system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;color:var(--ink);display:flex;justify-content:center}
#app{position:relative;width:100%;max-width:420px;min-height:100vh;background:var(--bg);display:flex;flex-direction:column}
@media(min-width:421px){#app{min-height:calc(100vh - 40px);margin:20px 0;border-radius:32px;overflow:hidden;box-shadow:0 0 0 8px #0a0705,0 30px 80px rgba(0,0,0,.6)}}
.ic{display:inline-block;vertical-align:middle;flex:none;width:22px;height:22px}
.pad{padding:18px 18px 44px}
h1.t{font-size:20px;line-height:1.25;margin:8px 0 6px;font-weight:800}
.sub{color:var(--muted);font-size:13.5px;line-height:1.5}
.hello{color:var(--muted);font-size:13px;font-weight:600;margin-top:4px}
.center{text-align:center}
.hdr{flex:none;background:var(--dark);color:#f4eee3;display:flex;align-items:center;gap:2px;padding:10px 12px;position:relative;z-index:6}
.brand{display:flex;align-items:center;gap:9px;margin-right:auto;cursor:pointer}
.brand b{font-size:15px;font-weight:800;letter-spacing:.02em}
.brand svg{width:27px;height:27px}
.tchip{border:none;background:var(--warn);color:#fff;font:inherit;font-size:10px;font-weight:800;letter-spacing:.08em;padding:4px 9px;border-radius:99px;cursor:pointer}
.hbtn{position:relative;width:40px;height:40px;border:none;background:transparent;color:#f4eee3;border-radius:12px;display:flex;align-items:center;justify-content:center;cursor:pointer}
.hbtn:active{background:rgba(255,255,255,.12)}
#badge{position:absolute;top:3px;right:2px;min-width:17px;height:17px;padding:0 4px;border-radius:9px;background:var(--accent);color:#fff;font-style:normal;font-size:10.5px;font-weight:700;display:flex;align-items:center;justify-content:center}
main{flex:1;overflow-y:auto;scrollbar-width:none;display:flex;flex-direction:column;position:relative}
main::-webkit-scrollbar{display:none}
.se{animation:se .3s ease}
@keyframes se{from{opacity:0;transform:translateY(8px)}to{opacity:1}}
.btn{width:100%;height:52px;border:none;border-radius:14px;font:inherit;font-weight:700;font-size:15.5px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;margin-top:16px;text-decoration:none}
.btn:active{transform:translateY(1px)}
.bp{background:var(--accent);color:#fff}
.bwa{background:var(--wa);color:#fff}
.bg2{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.bd{background:var(--dark);color:#f4eee3}
.lnk{border:none;background:none;color:var(--accent);font:inherit;font-size:13px;font-weight:700;cursor:pointer;padding:2px 4px}
.steps{display:flex;gap:5px;margin:2px 0 4px}
.steps i{height:4px;border-radius:2px;flex:1;background:var(--line)}
.steps i.on{background:var(--accent)}
.steps-lb{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:4px}
.tgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}
.tgrid>*,.g3>*,.g2>*{min-width:0}
.tcard{border:1.5px solid var(--line);background:var(--card);border-radius:18px;padding:9px;cursor:pointer;font:inherit;text-align:left;overflow:hidden}
.tcard:active{transform:scale(.98)}
.tcard-center{display:block;width:calc(50% - 6px);margin:12px auto 0}
.timg{border-radius:12px;overflow:hidden;aspect-ratio:1;border:1px solid var(--line)}
.timg svg,.timg img{width:100%;height:100%;display:block;object-fit:cover}
.tname{display:flex;align-items:center;justify-content:space-between;gap:6px;font-weight:800;font-size:13px;margin:9px 2px 2px}
.tname .ic{width:17px;height:17px;color:var(--muted)}
.tprice{font-size:12px;color:var(--accent);font-weight:700;margin:0 2px}
.note{display:flex;gap:10px;align-items:center;background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:11px 13px;margin-top:16px;font-size:12.5px;color:var(--muted);line-height:1.45}
.note .ic{color:var(--accent);flex:none}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:16px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
.sq{position:relative;border:1.5px solid var(--line);background:var(--card);border-radius:15px;padding:7px;cursor:pointer;font:inherit;text-align:left}
.sq.sel{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.sqimg{border-radius:10px;overflow:hidden;aspect-ratio:1;border:1px solid var(--line);position:relative}
.sqimg svg,.sqimg img{width:100%;height:100%;display:block;object-fit:cover}
.sqimg.custom{display:flex;align-items:center;justify-content:center;background:var(--accent-soft)}
.sqimg.custom .ic{width:28px;height:28px;color:var(--accent)}
.sqname{font-size:12.5px;font-weight:700;margin:6px 2px 1px;line-height:1.25}
.sqdesc{font-size:10.5px;color:var(--muted);margin:0 2px 2px;line-height:1.3}
.ck{position:absolute;top:-7px;right:-7px;width:22px;height:22px;border-radius:50%;background:var(--accent);color:#fff;display:none;align-items:center;justify-content:center}
.ck .ic{width:14px;height:14px}
.sel .ck{display:flex}
.swn{font-size:11.5px;font-weight:700;margin:6px 1px 1px;line-height:1.25}
.sprice{font-size:11px;font-weight:800;color:var(--accent);margin:1px 1px 2px;line-height:1.2}
.jprev{border-radius:16px;overflow:hidden;aspect-ratio:16/9;border:1px solid var(--line);margin-top:14px}
.jprev svg,.jprev img{width:100%;height:100%;display:block;object-fit:cover}
.jcap{font-size:12.5px;color:var(--muted);margin:8px 2px 0}
.ditem{border-radius:16px;overflow:hidden;aspect-ratio:1;max-width:300px;margin:14px auto 4px;border:1px solid var(--line)}
.ditem svg,.ditem img{width:100%;height:100%;object-fit:cover;display:block}
.th{border:1.5px solid var(--line);background:var(--card);border-radius:15px;padding:13px;cursor:pointer;font:inherit;text-align:left;position:relative}
.th b{font-size:16px;display:block}
.th span{color:var(--accent);font-weight:700;font-size:13.5px}
.th.sel{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.recap{display:flex;gap:12px;background:var(--card);border:1.5px solid var(--line);border-radius:16px;padding:10px;margin-top:14px;align-items:center}
.recap-img{width:82px;height:82px;border-radius:12px;overflow:hidden;flex:none;border:1px solid var(--line)}
.recap-img svg,.recap-img img{width:100%;height:100%;object-fit:cover;display:block}
.recap-t{font-weight:800;font-size:14px}
.recap-d{font-size:12px;color:var(--muted);line-height:1.5;margin-top:3px}
.cb{background:var(--card);border:1.5px solid var(--line);border-radius:16px;padding:13px;margin-top:12px}
.ch{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:9px}
.ch b{font-size:13.5px;line-height:1.3}
.stp{display:flex;align-items:center;gap:8px}
.stb{width:42px;height:42px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);display:flex;align-items:center;justify-content:center;cursor:pointer;flex:none}
.stin{flex:1;min-width:0;height:44px;border:none;background:transparent;font:inherit;font-size:17px;font-weight:800;text-align:center;outline:none}
.stu{font-size:12px;color:var(--muted);font-weight:700;flex:none}
.hint{display:flex;gap:6px;align-items:flex-start;font-size:12px;color:var(--muted);margin-top:8px;line-height:1.45}
.hint .ic{width:15px;height:15px;margin-top:1px;flex:none}
.sumline{display:flex;justify-content:space-between;align-items:baseline;gap:10px;border-top:1px dashed var(--line);margin-top:11px;padding-top:10px;font-size:12.5px;color:var(--muted)}
.sumline b{color:var(--ink);font-size:14.5px;white-space:nowrap}
.dtotal{display:flex;justify-content:space-between;align-items:baseline;margin-top:4px}
.dtotal span{font-size:13.5px;color:var(--muted);font-weight:700}
.dtotal b{font-size:21px;white-space:nowrap}
.lead{display:flex;gap:8px;align-items:flex-start;background:var(--accent-soft);border-radius:13px;padding:11px 13px;font-size:12.5px;color:var(--accent-dark);line-height:1.5;margin-top:14px}
.lead .ic{width:17px;height:17px}
.tbar{position:sticky;bottom:0;background:var(--card);border-top:1px solid var(--line);padding:12px 18px 24px;display:flex;align-items:center;gap:14px;box-shadow:0 -8px 24px -12px rgba(46,32,18,.15)}
.tb-l span{display:block;font-size:11.5px;color:var(--muted);font-weight:700}
.tb-l b{font-size:19px}
.tb-b{margin-top:0;flex:1;height:50px}
.paysum{display:flex;justify-content:space-between;align-items:center;background:var(--dark);color:#f4eee3;border-radius:16px;padding:15px 17px;margin:14px 0 4px}
.paysum span{font-size:12.5px;opacity:.75}
.paysum b{font-size:20px}
.pays{display:flex;flex-direction:column;gap:9px;margin-top:12px}
.pay{display:flex;align-items:center;gap:12px;border:1.5px solid var(--line);background:var(--card);border-radius:15px;padding:11px 13px;cursor:pointer;font:inherit;text-align:left}
.pay.sel{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
@keyframes payflash{0%,100%{border-color:var(--line)}50%{border-color:var(--warn)}}
.pays.flash .pay{animation:payflash .9s ease 2}
.payic{width:56px;height:32px;background:#fff;border:1px solid var(--line);border-radius:8px;display:flex;align-items:center;justify-content:center;flex:none}
.payic svg{width:46px;height:22px}
.payic .ic{width:22px;height:22px;color:var(--dark)}
.payt{flex:1;min-width:0}
.payt b{display:block;font-size:14px}
.payt small{color:var(--muted);font-size:11.5px;line-height:1.3;display:block;margin-top:1px}
.rd{width:20px;height:20px;border-radius:50%;border:2px solid var(--line);flex:none;position:relative}
.pay.sel .rd{border-color:var(--accent)}
.pay.sel .rd:after{content:'';position:absolute;inset:3px;border-radius:50%;background:var(--accent)}
.spin{width:17px;height:17px;border:2.5px solid rgba(255,255,255,.35);border-top-color:#fff;border-radius:50%;animation:rot .7s linear infinite;flex:none}
@keyframes rot{to{transform:rotate(360deg)}}
.okmark{width:76px;height:76px;display:block;margin:24px auto 8px}
.okcard{background:var(--card);border:1.5px solid var(--line);border-radius:16px;padding:6px 16px;margin-top:18px}
.okrow{display:flex;justify-content:space-between;gap:10px;font-size:13px;padding:9px 0;border-bottom:1px dashed var(--line)}
.okrow:last-child{border:none}
.okrow span{color:var(--muted)}
.okrow b.warn{color:var(--warn)}
.okrow b.ok{color:var(--ok)}
.seg{display:flex;background:#eae0cd;border-radius:12px;padding:4px;gap:4px;margin:14px 0 4px}
.seg button{flex:1;height:38px;border:none;border-radius:9px;background:transparent;font:inherit;font-weight:700;font-size:12.5px;color:var(--muted);cursor:pointer;display:flex;align-items:center;justify-content:center;gap:5px}
.seg button.on{background:#fff;color:var(--ink)}
.seg .ic{width:14px;height:14px}
.ocard{background:var(--card);border:1.5px solid var(--line);border-radius:16px;padding:13px 14px;margin-top:12px}
.ochead{display:flex;justify-content:space-between;align-items:center;gap:8px}
.ochead b{font-size:13.5px}
.chip{border:none;border-radius:99px;color:#fff;font:inherit;font-size:11px;font-weight:800;padding:5px 11px}
.chip.new{background:var(--accent)}.chip.work{background:var(--warn)}.chip.ready{background:var(--ok)}.chip.done{background:#a2958a}
.ocdate{font-size:11px;color:var(--muted);margin-top:3px}
.ocuser{font-size:13px;font-weight:700;margin-top:7px}
.ocbody{font-size:12.5px;color:var(--muted);line-height:1.6;margin-top:6px;padding-top:7px;border-top:1px dashed var(--line)}
.octotal{display:flex;justify-content:space-between;margin-top:8px;padding-top:8px;border-top:1px dashed var(--line);font-size:13px;color:var(--muted)}
.octotal b{font-size:16px;color:var(--ink)}
.ocfoot{font-size:11px;color:var(--muted);margin-top:4px}
.ocfoot .unpaid{color:var(--warn);font-weight:700}
.empty{text-align:center;color:var(--muted);padding:46px 0;font-size:13.5px}
.empty .ic{display:block;margin:0 auto 8px;width:36px;height:36px;color:#c8bba6}
.pindots{display:flex;justify-content:center;gap:14px;margin:20px 0}
.pindots i{width:15px;height:15px;border-radius:50%;border:2px solid var(--line)}
.pindots i.on{background:var(--accent);border-color:var(--accent)}
.pinpad{display:grid;grid-template-columns:repeat(3,64px);gap:11px;justify-content:center;margin-top:4px}
.pk{width:64px;height:54px;border-radius:15px;border:1.5px solid var(--line);background:var(--card);font:inherit;font-size:20px;font-weight:800;color:var(--ink);cursor:pointer;display:flex;align-items:center;justify-content:center}
.field{display:block;margin-top:13px}
.field>span{display:block;font-size:12px;font-weight:700;color:var(--muted);margin:0 2px 6px}
.field input,.field textarea{width:100%;border:1.5px solid var(--line);background:var(--card);border-radius:12px;height:50px;padding:0 14px;font:inherit;font-size:15.5px;outline:none}
.field textarea{height:auto;min-height:80px;padding:11px 14px;resize:none;line-height:1.5}
.field input:focus,.field textarea:focus{border-color:var(--accent)}
.field input.err{border-color:#c0392b}
.ferr{color:#c0392b;font-size:12px;margin:5px 2px 0}
.cpanel{overflow:hidden;max-height:0;opacity:0;transition:max-height .3s,opacity .3s,margin .3s}
.cpanel.open{max-height:260px;opacity:1;margin-top:12px}
.toast{position:absolute;bottom:80px;left:50%;transform:translateX(-50%) translateY(14px);opacity:0;background:#2b2119;color:#f4eee3;padding:10px 16px;border-radius:12px;font-size:13px;font-weight:600;transition:.3s;z-index:70;pointer-events:none;max-width:86%;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%)}
.cphone{font-size:20px;font-weight:800;letter-spacing:.02em;text-align:center;margin:10px 0 2px}
.crow{display:flex;gap:8px;margin-top:12px}
.cbtn{flex:1;min-width:0;height:54px;border:none;border-radius:13px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:#fff;font:inherit;font-size:10px;font-weight:800;cursor:pointer;text-decoration:none}
.cbtn .ic{width:19px;height:19px}
.cbtn.wa{background:#2fae4d}.cbtn.tg{background:#2a9fd6}.cbtn.mx{background:#5b53e6}.cbtn.call{background:var(--dark)}
.cbtn:active{transform:translateY(1px)}
.sheet{position:absolute;inset:0;z-index:60;display:flex;align-items:flex-end}
.sheet[hidden]{display:none}
.sheet-bg{position:absolute;inset:0;background:rgba(20,12,6,.5);opacity:0;transition:opacity .25s}
.sheet.show .sheet-bg{opacity:1}
.sheet-card{position:relative;width:100%;background:var(--card);border-radius:22px 22px 0 0;padding:10px 18px 30px;transform:translateY(100%);transition:transform .28s cubic-bezier(.2,.8,.3,1)}
.sheet.show .sheet-card{transform:none}
.sheet-grab{width:44px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 10px}
.sheet-head{display:flex;align-items:center;justify-content:space-between;gap:8px}
.sheet-head b{font-size:16px}
.hbtnx{width:36px;height:36px;border:none;background:var(--bg);color:var(--ink);border-radius:11px;display:flex;align-items:center;justify-content:center;cursor:pointer}
.hbtnx .ic{width:18px;height:18px}
.sheet-sub{font-size:12.5px;color:var(--muted);margin-top:3px;line-height:1.4}
.sheet-phone{display:flex;align-items:center;justify-content:center;gap:8px;font-size:21px;font-weight:800;letter-spacing:.02em;margin:14px 0 4px}
.sheet-phone .ic{width:19px;height:19px;color:var(--accent)}
.sbtn{display:flex;align-items:center;gap:12px;width:100%;height:52px;border:none;border-radius:14px;font:inherit;font-weight:800;font-size:14.5px;cursor:pointer;margin-top:10px;padding:0 15px;text-decoration:none;color:#fff}
.sbtn .ic{width:21px;height:21px}
.sbtn>span{flex:none}
.sbtn small{margin-left:auto;font-weight:600;font-size:11px;opacity:.85;text-align:right}
.sbtn:active{transform:translateY(1px)}
.sbtn.wa{background:#2fae4d}
.sbtn.tg{background:#2a9fd6}
.sbtn.mx{background:#5b53e6}
.sbtn.call{background:var(--dark)}
.splash{position:absolute;inset:0;background:var(--bg);z-index:40;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity .45s;cursor:pointer}
.splash.out{opacity:0;pointer-events:none}
.slogo{display:flex;align-items:center;gap:9px;font-weight:800;font-size:13px;color:var(--dark)}
.slogo svg{width:26px;height:26px}
.stitle{font-weight:900;font-size:30px;color:var(--dark);white-space:nowrap;margin-top:26px;letter-spacing:.01em}
.stitle span{display:inline-block;opacity:0;animation:rise .5s forwards}
.ssub{font-size:13px;letter-spacing:.3em;text-indent:.3em;color:var(--accent);font-weight:700;opacity:0;animation:rise .6s 1.1s forwards}
.sbricks{width:190px;margin-top:34px}
.sbricks rect{opacity:0;animation:rise .5s forwards}
@keyframes rise{to{opacity:1}}
</style>
</head>
<body>
<div id="app">
  <div class="hdr" id="hdr" hidden>
    <button class="hbtn" id="backBtn" hidden><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg></button>
    <div class="brand" id="brandBtn">
      <svg viewBox="0 0 27 27"><rect width="27" height="27" rx="8" fill="#b0522c"/><path d="M6.5 13.2 13.5 7l7 6.2" fill="none" stroke="#fff" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/><path d="M8.2 12.6V20h10.6v-7.4" fill="none" stroke="#fff" stroke-width="1.9" stroke-linejoin="round"/><path d="M8.2 15.7h10.6M8.2 18.2h10.6M11.5 13.9v6.1M15.5 13.9v6.1" stroke="#fff" stroke-width="1.1" opacity=".85"/></svg>
      <b>АСК-Фасад</b>
    </div>
    <button class="tchip" id="testChip" hidden>ТЕСТ · ВЫЙТИ</button>
    <button class="hbtn" id="callBtn"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.9v2.6a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.4 19.4 0 0 1-6-6A19.8 19.8 0 0 1 2.1 3.7 2 2 0 0 1 4.1 1.5h2.6a2 2 0 0 1 2 1.7c.13.96.36 1.9.7 2.8a2 2 0 0 1-.45 2.1L7.7 9.3a16 16 0 0 0 6 6l1.2-1.25a2 2 0 0 1 2.1-.45c.9.34 1.84.57 2.8.7a2 2 0 0 1 1.7 2z"/></svg></button>
    <button class="hbtn" id="ordersBtn"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 3h14v18l-2.3-1.5-2.4 1.5-2.3-1.5L9.7 21l-2.4-1.5L5 21V3z"/><path d="M9 8h6M9 12h6"/></svg><i id="badge" hidden></i></button>
  </div>
  <main id="scr"></main>
  <div class="toast" id="toast"></div>

  <div class="sheet" id="sheet" hidden>
    <div class="sheet-bg" id="sheetBg"></div>
    <div class="sheet-card">
      <div class="sheet-grab"></div>
      <div class="sheet-head">
        <b>Связаться с менеджером</b>
        <button class="hbtnx" id="sheetClose"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6L6 18M6 6l12 12"/></svg></button>

 r=Math.round((t-r)*p+r);g=Math.round((t-g)*p+g);b=Math.round((t-b)*p+b);
 return '#'+((r<<16|g<<8|b)|0).toString(16).padStart(6,'0');
}

function makeBond(n,gY,gX,pitch){
 var bh=(1-(n-1)*gY)/n,rows=[],cells=[];
 for(var i=0;i<n;i++){
  var y0=i*(bh+gY),y1=(i===n-1)?1:(y0+bh+gY);
  rows.push({y0:y0,y1:y1});
  var off=(i%2)?pitch/2:0;
  for(var x=off-pitch;x<1;x+=pitch){
   cells.push([x,x+pitch-gX,y0,y0+bh]);
  }
 }
 return {rows:rows,cells:cells,inset:pitch/2};
}

function panelScene(W,H,minA,maxA,layout,frame,b,j,seed){
 var aspect=Math.min(Math.max(W/H,minA),maxA);
 var pw=Math.min(W,H*aspect),ph=pw/aspect;
 var x0=(W-pw)/2,y0=(H-ph)/2;
 var ins=layout.inset*pw;
 var rows=layout.rows,n=rows.length,i;
 var pts=[{x:0,y:0},{x:pw,y:0}];
 for(i=0;i<n;i++){
  var rx=(i%2===0)?pw:pw-ins;
  var ay=rows[i].y0*ph,by=rows[i].y1*ph;
  if(i>0&&Math.abs(rx-pts[pts.length-1].x)>0.01)pts.push({x:rx,y:ay});
  pts.push({x:rx,y:by});
 }
 var lastL=((n-1)%2===0)?0:ins;
 pts.push({x:lastL,y:ph});
 for(i=n-1;i>=0;i--){
  var lx=(i%2===0)?0:ins;
  pts.push({x:lx,y:rows[i].y1*ph});
  pts.push({x:lx,y:rows[i].y0*ph});
 }
 function P(dx,dy){
  var s='';
  for(var q=0;q<pts.length;q++)s+=(x0+pts[q].x+dx).toFixed(1)+','+(y0+pts[q].y+dy).toFixed(1)+' ';
  return s.trim();
 }
 var id='cp'+(++clipSeq);
 var s='<svg viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="xMidYMid slice">';
 s+=tileBg(W,H);
 s+='<polygon points="'+P(6,7)+'" fill="#a8a49b" fill-opacity=".5"/>';
 s+='<polygon points="'+P(3,4)+'" fill="#fcfbf8"/>';
 s+='<clipPath id="'+id+'"><polygon points="'+P(0,0)+'"/></clipPath>';
 s+='<g clip-path="url(#'+id+')">';
 s+='<rect x="'+x0.toFixed(1)+'" y="'+y0.toFixed(1)+'" width="'+pw.toFixed(1)+'" height="'+ph.toFixed(1)+'" fill="'+j+'"/>';
 var r=rng(seed||7),cells=layout.cells;
 for(i=0;i<cells.length;i++){
  var c=cells[i];
  var cx=x0+c[0]*pw,cy=y0+c[2]*ph,cw=(c[1]-c[0])*pw,ch=(c[3]-c[2])*ph;
  if(cw<=0||ch<=0)continue;
  s+='<rect x="'+cx.toFixed(1)+'" y="'+cy.toFixed(1)+'" width="'+cw.toFixed(1)+'" height="'+ch.toFixed(1)+'" rx="1.5" fill="'+shade(b,(r()-.5)*.14)+'"/>';
  var shd=Math.max(1,ch*0.08);
  s+='<rect x="'+cx.toFixed(1)+'" y="'+(cy+ch-shd).toFixed(1)+'" width="'+cw.toFixed(1)+'" height="'+shd.toFixed(1)+'" fill="#000" fill-opacity=".12"/>';
  if(cw*ch>1500){
   var nd=cw*ch>6000?5:3;
   for(var d=0;d<nd;d++){
    var px=cx+2+r()*(cw-4),py=cy+2+r()*(ch-4);
    s+='<circle cx="'+px.toFixed(1)+'" cy="'+py.toFixed(1)+'" r="'+(0.7+r()*0.9).toFixed(2)+'" fill="'+(r()<.5?shade(b,-0.32):shade(b,0.3))+'" fill-opacity=".45"/>';
   }
  }
 }
 s+='<polygon points="'+P(0,0)+'" fill="none" stroke="'+j+'" stroke-width="'+(ph*frame).toFixed(1)+'"/>';
 s+='</g></svg>';
 return s;
}

 +'<div class="sub">Выберите номер элемента — всего '+cat.count+' вариантов</div>'
 +(cat.twoM?'<div class="note">'+ic('info')+'<span>Все элементы имеют длину 2 метра.</span></div>':'')
 +'<div class="g3">'+out+'</div></div>';
}

function maskPhone(input){
 var d=input.value.replace(/\D/g,'');
 if(d.charAt(0)==='8')d='7'+d.slice(1);
 if(d&&d.charAt(0)!=='7')d='7'+d;
 d=d.slice(0,11);
 var r=d?'+7':'';
 if(d.length>1)r+=' ('+d.slice(1,4);
 if(d.length>=5)r+=') '+d.slice(4,7);
 if(d.length>=8)r+='-'+d.slice(7,9);
 if(d.length>=10)r+='-'+d.slice(9,11);
 input.value=r;
}
function recalc(){
 var p=draft.type==='brick'?PRICE_BRICK:PRICE_CERAM;
 var g=draft.type==='brick'?GROUT_BRICK:GROUT_CERAM;
 var a=getArea();
 var pan=a*(p[draft.thickness]||0),gl=(draft.glue||0)*ADHESIVE.price,gr=(draft.grout||0)*g.price;
 function set(id,v){var el=$(id);if(el)el.textContent=v;}
 set('#panDesc','Панели · '+draft.thickness+' см · '+fmtArea(a)+' м² × '+fmt(p[draft.thickness])+' ₽');
 set('#sumPan',fmt(pan)+' ₽');
 set('#glueDesc','Клей-пена · '+(draft.glue||0)+' × '+fmt(ADHESIVE.price)+' ₽');
 set('#sumGlue',fmt(gl)+' ₽');
 set('#groutDesc','Затирка · '+(draft.grout||0)+' × '+fmt(g.price)+' ₽');
 set('#sumGrout',fmt(gr)+' ₽');
 set('#total',fmt(pan+gl+gr)+' ₽');
 set('#glueHint',a>0?('на '+fmtArea(a)+' м² нужно ≈ '+glueNeed(a)+' балл. (по '+ADHESIVE.coverage+' м² на баллон)'):('одного баллона хватает примерно на '+ADHESIVE.coverage+' м² · '+fmt(ADHESIVE.price)+' ₽/баллон'));
 set('#groutHint',a>0?(draft.type==='brick'?('на '+fmtArea(a)+' м² нужно ≈ '+groutPacks(a)*5+' кг — это '+groutPacks(a)+' уп. по 5 кг'):('на '+fmtArea(a)+' м² нужно ≈ '+groutPacks(a)+' вед. по 5 кг')):gHint);
}
function stepper(f,dir){
 if(f==='area'){
  draft.area=Math.max(0,getArea()+dir);
  var i=$('#areaInput');if(i)i.value=draft.area||'';
  autoAssign();
  var gi=$('#glueInput');if(gi)gi.value=draft.glue||'';
  var ri=$('#groutInput');if(ri)ri.value=draft.grout||'';
 }else{
  draft[f]=Math.max(0,(draft[f]||0)+dir);
  var el2=$(f==='glue'?'#glueInput':'#groutInput');if(el2)el2.value=draft[f];
 }
 recalc();
}
function nextOrderId(){return 'АС-'+String(app.orders.length+1).padStart(4,'0');}
function createOrder(payName,payKind){
 var p=draft.type==='brick'?PRICE_BRICK:PRICE_CERAM;
 var g=draft.type==='brick'?GROUT_BRICK:GROUT_CERAM;
 var lines;
 if(draft.type==='brick'){
  lines=['Гибкий кирпич · формат «'+FORMATS[draft.format].n+'»',
   'Кирпич: '+brickName()+' · Шов: '+jointName(),
   'Толщина: '+draft.thickness+' см · '+fmtArea(getArea())+' м² × '+fmt(p[draft.thickness])+' ₽',
   ADHESIVE.name+' × '+draft.glue+' · Затирка × '+draft.grout+' '+g.unit];
 }else{
  lines=['Керамика · плитка '+(draft.tile!=null?('№'+TILES[draft.tile].n):'—')+' (Керамин)',
   'Шов: '+jointName(),
   'Толщина: '+draft.thickness+' см · '+fmtArea(getArea())+' м² × '+fmt(p[draft.thickness])+' ₽',
   ADHESIVE.name+' × '+draft.glue+' · Затирка × '+draft.grout+' '+g.unit];
 }
 var o={id:nextOrderId(),
  dateStr:new Date().toLocaleString('ru-RU',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'}),
  user:{name:app.user.name,phone:app.user.phone},
  lines:lines,total:calcTotal(),pay:payName,payKind:payKind||'online',
  readyStr:fmtDate(nextBusinessDate()),status:'new'};
 app.orders.unshift(o);saveOrders();return o;
}
function createDecorOrder(ci,item,qty,glue){
 var c=DECOR[ci];
 var price=decorPrice(ci,item);
 var total=price*qty+glue*ADHESIVE.price;
 var o={id:nextOrderId(),
  dateStr:new Date().toLocaleString('ru-RU',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'}),
  user:{name:app.user.name,phone:app.user.phone},
  decor:true,qty:qty,glue:glue,
  lines:[c.n+' №'+item+' · '+qty+' шт × '+fmt(price)+' ₽',
   ADHESIVE.name+' × '+glue+' балл. × '+fmt(ADHESIVE.price)+' ₽'],
  total:total,pay:'Согласуется с менеджером',payKind:'decor',
  readyStr:'согласуется с менеджером',status:'new'};
 app.orders.unshift(o);saveOrders();return o;
}
function updateBadge(){
 var b=$('#badge');if(!b)return;
 if(!app.user){b.hidden=true;return;}
 var list=app.admin?app.orders:app.orders.filter(function(o){return o.user.phone===app.user.phone;});
 var n=0;for(var i=0;i<list.length;i++)if(list[i].status!=='done')n++;
 b.hidden=!n;b.textContent=n;
}

var binders={
 auth:function(){
  $('#tel').addEventListener('input',function(e){maskPhone(e.target);});
  $('#authBtn').onclick=function(){
   var fio=$('#fio').value.trim(),tel=$('#tel').value;

   $('#tel').classList.toggle('err',!okT);$('#telErr').hidden=okT;
   if(!okF||!okT)return;
   app.user={name:fio,phone:tel};app.test=false;LS.del('asf_test');
   LS.set('asf_user',JSON.stringify(app.user));

  };
  $('#testBtn').onclick=startTest;
 },
 home:function(){
  $$('.tcard').forEach(function(b){

    newDraft(t);

 },

  $('#customBtn').onclick=function(){draft.brick='custom';render();};

  if(ta)ta.addEventListener('input',function(e){draft.customText=e.target.value;});
  $('#nextBtn').onclick=function(){
   if(draft.brick==='custom'&&!draft.customText.trim()){
    $('#customErr').hidden=false;$('#cpanel').classList.add('open');return;
   }

 },
 joint:function(){
  $$('.g3 .sq[data-i]').forEach(function(b){b.onclick=function(){draft.joint=+b.dataset.i;render();};});
  $('#jcustomBtn').onclick=function(){draft.joint='custom';render();};
  var ta=$('#jcustomText');
  if(ta)ta.addEventListener('input',function(e){draft.jointText=e.target.value;});
  $('#nextBtn').onclick=function(){
   if(draft.joint==='custom'&&!draft.jointText.trim()){
    $('#jcustomErr').hidden=false;$('#jcpanel').classList.add('open');return;
   }
   go('thick');
  };
 },
 tile:function(){
  $$('.g3 .sq[data-i]').forEach(function(b){b.onclick=function(){draft.tile=+b.dataset.i;render();};});
  $('#nextBtn').onclick=function(){go('joint');};
 },
 thick:function(){
  $$('[data-th]').forEach(function(b){b.onclick=function(){draft.thickness=+b.dataset.th;render();};});
  $('#nextBtn').onclick=function(){go('calc');};
 },
 calc:function(){
  $$('.stb').forEach(function(b){b.onclick=function(){stepper(b.dataset.f,b.dataset.act==='plus'?1:-1);};});
  var ft=$('#fillTest');
  if(ft)ft.onclick=function(){
   draft.area='50';
   autoAssign();
   $('#areaInput').value='50';
   $('#glueInput').value=draft.glue||'';$('#groutInput').value=draft.grout||'';
   recalc();
   toast('Тестовые данные подставлены — жмите «К оплате»');
  };
  $('#areaInput').addEventListener('input',function(e){
   draft.area=e.target.value.replace(/[^\d.,]/g,'');
   autoAssign();
   $('#glueInput').value=draft.glue||'';$('#groutInput').value=draft.grout||'';
   recalc();
  });
  $('#glueInput').addEventListener('input',function(e){draft.glue=Math.max(0,parseInt(e.target.value)||0);recalc();});
  $('#groutInput').addEventListener('input',function(e){draft.grout=Math.max(0,parseInt(e.target.value)||0);recalc();});
  $('#autoGlue').onclick=function(){var a=getArea();if(a<=0){toast('Сначала укажите площадь');return;}draft.glue=glueNeed(a);$('#glueInput').value=draft.glue;recalc();};
  $('#autoGrout').onclick=function(){var a=getArea();if(a<=0){toast('Сначала укажите площадь');return;}draft.grout=groutPacks(a);$('#groutInput').value=draft.grout;recalc();};
  $('#toPay').onclick=function(){
   if(!(getArea()>0)){toast('Сначала укажите площадь покрытия');return;}
   go('pay');
  };
  recalc();
 },
 pay:function(){
  $$('[data-pay]').forEach(function(b){b.onclick=function(){draft.pay=b.dataset.pay;render();};});
  $('#payBtn').onclick=function(){
   if(!draft.pay){
    toast('Сначала выберите способ оплаты');
    var pl=$('#payList');
    if(pl){pl.classList.remove('flash');void pl.offsetWidth;pl.classList.add('flash');}
    return;
   }
   var m=null;
   for(var i=0;i<PAY_METHODS.length;i++)if(PAY_METHODS[i].id===draft.pay)m=PAY_METHODS[i];
   if(!m)return;
   if(m.kind==='cash'){
    var oc=createOrder(m.name,'cash');
    draft=null;
    app.stack=[{name:'home'},{name:'success',params:{id:oc.id}}];
    render();
    return;
   }
   payPending=m;
   $('#paySheetSum').textContent=fmt(calcTotal())+' ₽';
   $('#paySheetMethod').textContent='Способ: '+m.name;
   showSheetEl($('#paySheet'));
  };
 },
 success:function(){
  $('#okHome').onclick=home;
  $('#okOrders').onclick=function(){app.tab='mine';go('orders');};
 },
 orders:function(){
  $$('.seg [data-tab]').forEach(function(b){
   b.onclick=function(){
    if(b.dataset.tab==='all'&&!app.admin){app.pinBuf='';go('pin');return;}
    app.tab=b.dataset.tab;render();
   };
  });
  $$('.chip[data-oid]').forEach(function(c){
   if(!app.admin||app.tab!=='all')return;
   c.onclick=function(){
    var o=null;for(var i=0;i<app.orders.length;i++)if(app.orders[i].id===c.dataset.oid)o=app.orders[i];
    if(!o)return;
    var idx=0;for(var j=0;j<STATUSES.length;j++)if(STATUSES[j].id===o.status)idx=j;
    o.status=STATUSES[(idx+1)%STATUSES.length].id;
    saveOrders();render();
    toast('№ '+o.id+' → '+STATUSES[(idx+1)%STATUSES.length].t);
   };
  });
  var ex=$('#exitAdmin');
  if(ex)ex.onclick=function(){app.admin=false;LS.del('asf_admin');app.tab='mine';render();toast('Режим владельца выключен');};
  $('#logout').onclick=function(){
   app.user=null;app.admin=false;app.test=false;
   LS.del('asf_user');LS.del('asf_admin');LS.del('asf_test');
   app.stack=[{name:'auth'}];render();
  };
 },
 pin:function(){
  $$('.pk[data-k]').forEach(function(b){
   b.onclick=function(){
    var k=b.dataset.k;
    if(k==='del'){app.pinBuf=app.pinBuf.slice(0,-1);render();return;}
    if(app.pinBuf.length>=4)return;
    app.pinBuf+=k;render();
    if(app.pinBuf.length===4)setTimeout(function(){
     if(app.pinBuf===ADMIN_PIN){
      app.admin=true;LS.set('asf_admin','1');app.tab='all';app.pinBuf='';
      back();toast('Режим владельца включён');
     }else{app.pinBuf='';render();toast('Неверный код');}
    },180);
   };
  });
 },
 decor:function(){
  $$('.dcat').forEach(function(b){
   b.onclick=function(){go('decorlist',{cat:+b.dataset.cat});};
  });
 },
 decorlist:function(){
  var p=app.stack[app.stack.length-1].params||{cat:0};
  $$('.sq[data-item]').forEach(function(b){
   b.onclick=function(){go('decoritem',{cat:p.cat,item:+b.dataset.item});};
  });
 },
 decoritem:function(){
  var p=app.stack[app.stack.length-1].params||{cat:0,item:1};
  var price=decorPrice(p.cat,p.item);
  var inp=$('#qtyInput'),gin=$('#dglueInput');
  function dtotal(){
   var q=Math.max(1,parseInt(inp.value)||1);
   var g=Math.max(0,parseInt(gin.value)||0);
   var t=$('#dtotal');if(t)t.textContent=fmt(price*q+g*ADHESIVE.price)+' ₽';
  }
  $$('.stb').forEach(function(b){
   b.onclick=function(){
    var dir=(b.dataset.act==='plus')?1:-1;
    if(b.dataset.f==='qty'){
     var v=(parseInt(inp.value)||1)+dir;
     if(v<1)v=1;
     inp.value=v;
    }else{
     var gv=(parseInt(gin.value)||0)+dir;
     if(gv<0)gv=0;
     gin.value=gv;
    }
    dtotal();
   };
  });
  inp.addEventListener('input',dtotal);
  gin.addEventListener('input',dtotal);
  $('#dorder').onclick=function(){
   var qty=Math.max(1,parseInt(inp.value)||1);
   var glue=Math.max(0,parseInt(gin.value)||0);
   var o=createDecorOrder(p.cat,p.item,qty,glue);
   app.stack=[{name:'home'},{name:'success',params:{id:o.id}}];
   render();
   toast('Заявка оформлена — отправьте её менеджеру');
  };
 }
};

(function initSplash(){
 var t='';
 for(var i=0;i<'ТЕРМОПАНЕЛИ'.length;i++){
  t+='<span style="animation-delay:'+(0.15+i*0.05).toFixed(2)+'s">'+'ТЕРМОПАНЕЛИ'.charAt(i)+'</span>';
 }
 $('#sTitle').innerHTML=t;
 var cols=['#a8432c','#bd5c38','#8a5a3b','#7c543a','#b87333','#5a3a28'],br='';
 for(var j=0;j<cols.length;j++){
  br+='<rect x="'+(j*32)+'" y="0" width="28" height="13" rx="3" fill="'+cols[j]+'" style="animation-delay:'+(1.35+j*0.09).toFixed(2)+'s"/>';
 }
 $('#sBricks').innerHTML=br;
 var sp=$('#splash'),ended=false;
 function end(){
  if(ended)return;ended=true;
  sp.classList.add('out');
  setTimeout(function(){sp.remove();app.stack=[{name:app.user?'home':'auth'}];render();},450);
 }
 setTimeout(end,2800);
 sp.addEventListener('click',end);
})();
